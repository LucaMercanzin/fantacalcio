
[tool.ruff.lint]
ignore = ["DTZ011", "SIM113", "PLC0206"]

[tool.ruff.lint.per-file-ignores]
# Pipeline/CLI boundaries must isolate one player/source failure, log it and
# continue the batch. Keep this exception local instead of disabling BLE001
# for the whole project.
"pipeline/*.py" = ["BLE001"]
"scripts/*.py" = ["BLE001"]
"scrapers/fantanalisi_giocatore.py" = ["BLE001"]
"scrapers/pianetafanta.py" = ["BLE001"]
